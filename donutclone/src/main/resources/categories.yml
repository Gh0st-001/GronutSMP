# ==========================================================
#  Categories du /shop
#  icon: le material affiche comme icone de la categorie
#  slot: emplacement dans la derniere ligne du menu /shop (0-8)
#  items: liste des materials contenus dans la categorie
# ==========================================================

categories:
  nourriture:
    display-name: "&aNourriture"
    icon: COOKED_BEEF
    slot: 1
    items:
      - COOKED_BEEF
      - BREAD
      - GOLDEN_APPLE
      - ENCHANTED_GOLDEN_APPLE

  combat:
    display-name: "&cCombat"
    icon: DIAMOND_SWORD
    slot: 3
