      - IRON_SWORD
      - DIAMOND_SWORD
      - NETHERITE_SWORD
      - BOW
      - CROSSBOW
      - ARROW
      - SHIELD

  utiles:
    display-name: "&bUtiles"
    icon: ENDER_PEARL
    slot: 5
    items:
      - ENDER_PEARL
      - BLAZE_ROD
      - EXPERIENCE_BOTTLE
      - TOTEM_OF_UNDYING
      - ELYTRA
      - SHULKER_BOX

  blocs:
    display-name: "&eBlocs"
    icon: STONE
    slot: 7
    items:
      - DIRT
      - COBBLESTONE
      - STONE
      - OAK_LOG
      - SAND
      - GRAVEL
